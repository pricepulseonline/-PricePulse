<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow"/>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<link rel="stylesheet" href="pricepulse-v17.css?v=78.8.20">
<link rel="stylesheet" href="premium-v200.css?v=242">
<style>
/* V240 ADMIN PREVIEW: mirrors the NEW live product-page left column 1:1 (same classes, same stylesheet).
   The iframe is narrower than 1021px, so the desktop geometry is forced here. */
html,body{margin:0;padding:0;background:#fff;overflow:visible}
body{padding:0 8px;width:374px;font-family:var(--ppx-body,inherit)}
#ppAdminExactMirror{position:relative;padding:60px 0 60px;width:374px}
#ppAdminExactMirror .ppx-gallery.ppx-panel{position:relative;width:374px;box-sizing:border-box;padding:14px;gap:10px;display:flex;flex-direction:column;overflow-x:clip;overflow-y:visible;border-radius:24px}
#ppAdminExactMirror .ppx-gallery.is-cut{border:2px solid #e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.18)}
#ppAdminExactMirror .ppx-brand{display:flex!important;position:relative;z-index:6}
#ppAdminExactMirror .ppx-stage{aspect-ratio:auto!important;height:258px!important;box-sizing:border-box;padding:12px!important;border-radius:18px;z-index:2}
#ppAdminExactMirror .ppx-stage.pp-global-product-surface{overflow:visible!important}
#ppAdminExactMirror .ppx-stage .pp-global-product-image{position:relative!important;z-index:4!important}
#ppAdminExactMirror .ppx-thumbs{position:relative;z-index:6;gap:8px;min-height:58px}
#ppAdminExactMirror .ppx-thumb{width:58px;height:58px;padding:6px;border-radius:14px;cursor:pointer}
#ppAdminExactMirror .ppx-identity h1{order:0;font-size:24px;margin:0}
#ppAdminExactMirror .ppx-identity .ppx-badges{order:1}
#ppAdminExactMirror .ppx-identity .ppx-chips{order:2}
#ppAdminExactMirror .ppx-identity .ppx-id-actions{order:3;gap:8px}
#ppAdminExactMirror .ppx-identity .ppx-id-actions .ppx-btn{flex:1 1 0;min-width:0;padding:0 8px;gap:6px;font-size:13.5px;pointer-events:none}
#ppAdminExactMirror .ppx-identity .ppx-advice{order:4}
#ppAdminExactMirror .pp-preview-empty{height:100%;display:grid;place-items:center;color:#81929e;font-size:12px}
#cutWarn{position:absolute;left:0;right:0;top:8px;margin:0;padding:7px 10px;border-radius:10px;background:#fdecec;border:1px solid #f3b4b6;color:#b3262c;font:700 12px/1.35 system-ui,sans-serif}
#cutWarn[hidden]{display:none}
#sideNote{position:static;margin:10px 0 0;text-align:center;font:600 11px/1.3 system-ui,sans-serif;color:#7a8b94}
#ppAdminExactMirror .ppx-advice{font-size:12px;white-space:nowrap}
</style>
<script defer src="brand-logo-normalizer.js?v=78.8.20"></script>
</head>
<body>
<div id="ppAdminExactMirror" class="ppx-product">
  <p id="cutWarn" hidden></p>
  <section class="ppx-panel ppx-gallery" id="galleryPanel" aria-label="Product details">
    <div class="ppx-brand" id="brandWrap"><img class="pp-global-brand-logo" id="brandLogo" alt="Brand logo" hidden></div>
    <div class="ppx-stage pp-global-product-surface pp-img-bg-soft" id="visualStage">
      <img class="pp-global-product-image ppx-main-image" id="mainImage" alt="Product preview" hidden>
      <div class="pp-preview-empty" id="emptyState">Choose a product image to preview.</div>
    </div>
    <div class="ppx-thumbs" id="galleryRail"></div>
    <div class="ppx-identity">
      <h1 id="productTitle">Product</h1>
      <div class="ppx-badges"><span class="ppx-badge is-green">Verified product</span><span class="ppx-badge" id="storeCount">stores compared</span></div>
      <div class="ppx-chips" id="directValues"></div>
      <div class="ppx-id-actions"><span class="ppx-btn ppx-btn-soft">Save</span><span class="ppx-btn ppx-btn-soft">Share</span><span class="ppx-btn ppx-btn-soft">Compare</span></div>
      <p class="ppx-advice">Verify exact model &amp; variant on the retailer's page.</p>
    </div>
  </section>
  <p id="sideNote">Panel edge = where the image is cut at the side on the live site</p>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const clamp=(v,min,max,f)=>{const n=Number(v);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):f};
  const norm=item=>({
    url:String(item?.src||item?.url||'').trim(),
    bg:['soft','white','transparent','original'].includes(item?.bg)?item.bg:'soft',
    fit:['contain','cover'].includes(item?.fit)?item.fit:'contain',
    position:['center','top','bottom','left','right'].includes(item?.position)?item.position:'center',
    scale:String(clamp(item?.scale,70,260,100)),
    rotate:String(clamp(item?.rotate,-30,30,0)),
    x:String(clamp(item?.x,-30,30,0)),
    y:String(clamp(item?.y,-30,30,0)),
    slot:String(item?.slot||'')
  });
  const pos=v=>({center:'center center',top:'center top',bottom:'center bottom',left:'left center',right:'right center'})[v]||'center center';
  function bgClass(item){return 'pp-img-bg-'+norm(item).bg;}
  function fitImage(img,item){
    const c=norm(item); if(!img||!c.url)return; const host=img.parentElement;if(!host)return;
    const run=()=>{
      const nw=Number(img.naturalWidth)||0,nh=Number(img.naturalHeight)||0;if(!nw||!nh)return;
      const cs=getComputedStyle(host);
      const availW=Math.max(20,host.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0));
      const availH=Math.max(20,host.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0));
      const fitMode=c.fit==='cover'?'cover':'contain';
      const base=(fitMode==='cover'?Math.max(availW/nw,availH/nh):Math.min(availW/nw,availH/nh));
      const baseW=nw*base,baseH=nh*base;
      const rad=(Number(c.rotate)||0)*Math.PI/180,ca=Math.abs(Math.cos(rad)),sa=Math.abs(Math.sin(rad));
      const rotW=baseW*ca+baseH*sa,rotH=baseW*sa+baseH*ca;
      const desired=Math.max(.7,Math.min(2.6,(Number(c.scale)||100)/100));
      const isThumb=host.matches('.pp-v78-gallery-thumb,.pp-v52-gallery-thumb');
      const gutter=isThumb?.90:.96;
      // Exact Compare Popup mirror is a hero surface: Scale/X/Y must always be honored.
      // Thumbnails stay safe-fit so they remain useful selectors.
      const applied=isThumb
        ? Math.max(.2,Math.min(desired,(availW*gutter)/Math.max(1,rotW),(availH*gutter)/Math.max(1,rotH)))
        : Math.max(.2,desired);
      const preset=String(c.position||'center');
      const presetX=preset==='left'?-availW*.12:preset==='right'?availW*.12:0;
      const presetY=preset==='top'?-availH*.12:preset==='bottom'?availH*.12:0;
      const rawX=(Number(c.x)||0)/100*availW,rawY=(Number(c.y)||0)/100*availH;
      const tx=isThumb?0:(presetX+rawX);
      const ty=isThumb?0:(presetY+rawY);
      img.style.setProperty('width',baseW.toFixed(2)+'px','important');
      img.style.setProperty('height',baseH.toFixed(2)+'px','important');
      img.style.setProperty('max-width','none','important'); img.style.setProperty('max-height','none','important');
      img.style.setProperty('object-fit',fitMode,'important'); img.style.setProperty('object-position',pos(c.position),'important');
      img.style.setProperty('transform',`translate3d(${tx.toFixed(2)}px,${ty.toFixed(2)}px,0) rotate(${Number(c.rotate)||0}deg) scale(${applied.toFixed(4)})`,'important');
      img.style.setProperty('transform-origin','center center','important');
      setTimeout(checkCut,60);
    };
    img.src=c.url; img.hidden=false;
    if(img.complete&&img.naturalWidth)requestAnimationFrame(run);else img.addEventListener('load',()=>requestAnimationFrame(run),{once:true});
  }
  let state=null,activeSlot='primary';
  /* Side-cut check: the live product page clips the image at the panel's left/right edge (never over the price card). */
  function checkCut(){
    const panel=$('galleryPanel'),img=$('mainImage'),warn=$('cutWarn');
    if(!panel||!img||img.hidden){panel&&panel.classList.remove('is-cut');if(warn)warn.hidden=true;parent.postMessage({type:'pp-admin-live-preview-cut',cut:false},'*');return;}
    const pr=panel.getBoundingClientRect(),ir=img.getBoundingClientRect();
    const left=Math.max(0,Math.round(pr.left-ir.left)),right=Math.max(0,Math.round(ir.right-pr.right));
    const cut=left>2||right>2;
    panel.classList.toggle('is-cut',cut);
    if(warn){warn.hidden=!cut;warn.textContent=cut?`Image is cut at the ${left>2&&right>2?'left and right':left>2?'left':'right'} edge on the live site. Lower Scale or move X back toward 0.`:'';}
    parent.postMessage({type:'pp-admin-live-preview-cut',cut,left,right},'*');
  }
  function show(item){
    const visual=$('visualStage'),img=$('mainImage'),empty=$('emptyState');
    visual.classList.remove('pp-img-bg-soft','pp-img-bg-white','pp-img-bg-transparent','pp-img-bg-original');
    visual.classList.add(bgClass(item));
    if(!item?.url&&!item?.src){img.hidden=true;empty.hidden=false;return;}
    empty.hidden=true;fitImage(img,item);
  }
  function render(s){
    state=s||{}; activeSlot=String(s?.activeSlot||'primary');
    const brand=$('brandLogo');
    if(s.brandLogo){brand.src=s.brandLogo;brand.hidden=false;brand.alt=(s.brandName||'Brand')+' logo';}else{brand.hidden=true;brand.removeAttribute('src');}
    $('productTitle').textContent=s.name||'Product';
    $('directValues').innerHTML=(s.details||[]).map(v=>`<span>${String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</span>`).join('');
    const count=Number(s.listingCount)||0;$('storeCount').textContent=`${count||'—'} ${count===1?'store':'stores'} compared`;
    const items=(s.items||[]).map(norm);
    let active=items.find(x=>x.slot===activeSlot)||items.find(x=>x.slot==='primary')||items[0]||null;
    show(active||{});
    const rail=$('galleryRail');rail.innerHTML='';
    items.forEach((item,i)=>{
      const b=document.createElement('button');b.type='button';b.className='ppx-thumb'+(item===active?' is-active':'');b.setAttribute('aria-label','View product photo '+(i+1));
      const im=document.createElement('img');im.alt='';im.src=item.url;b.appendChild(im);rail.appendChild(b);
      b.addEventListener('click',()=>{activeSlot=item.slot||'';active=item;show(item);rail.querySelectorAll('button').forEach(x=>x.classList.toggle('is-active',x===b));setTimeout(checkCut,120);parent.postMessage({type:'pp-admin-live-preview-slot',slot:activeSlot},'*');});
    });
    requestAnimationFrame(()=>parent.postMessage({type:'pp-admin-live-preview-height',height:document.documentElement.scrollHeight},'*'));
  }
  addEventListener('message',e=>{if(e.data?.type==='pp-admin-live-preview-state')render(e.data.state);});
  addEventListener('resize',()=>state&&render(state));
  parent.postMessage({type:'pp-admin-live-preview-ready'},'*');
})();
</script>
</body>
</html>
